  platform: ps2
  compiler: MWCCPS2
  endianness: little
  gp_value: 0x2EF6F0

  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: ./config/SLUS_20199/undefined_funcs_auto.yaml
  create_undefined_syms_auto: True
  undefined_syms_auto_path: ./config/SLUS_20199/undefined_syms_auto.yaml

  asm_path: ./config/SLUS_20199/out/asm
  asset_path: ./config/SLUS_20199/out/assets
  build_path: ./build
  src_path: ./src/SLUS_20199/

  ld_script_path: ./config/SLUS_20199/SLUS_201.99.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: True

  find_file_boundaries: False

  make_full_disasm_for_code: True

  o_as_suffix: True

  symbol_addrs_path: ./config/SLUS_20199/symbol_addresses.txt
  reloc_addrs_path: ./config/SLUS_20199/reloc_addresses.txt


  extensions_path: tools/splat_ext

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  asm_emit_size_directive: True

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  generated_macro_inc_content: |
    .purgem nonmatching
    .macro nonmatching label, size=1
        .local "\label\().NON_MATCHING"
        .type "\label\().NON_MATCHING", @object
        .size "\label\().NON_MATCHING", \size
        "\label\().NON_MATCHING":
    .endm

    # Jump table targets are always private to their function. Declaring them
    # global stops the assembler resolving the branch itself and leaves an
    # R_MIPS_PC16 relocation, which MWLD then resolves one instruction short.
    .purgem jlabel
    .macro jlabel label, visibility=local
        .\visibility "\label"
        "\label":
    .endm

  section_order:
  - .text
  - .data
  - .rodata
  - .gcc_except_table
  - .lit8
  - .lit4
  - .sdata
  - .sbss
  - .bss
  # - .vubss


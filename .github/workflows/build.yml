name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: SLUS_201.99
            artifact_name: SLUS_201.99_report
            elf: config/SLUS_20199/SLUS_201.99
            splat_yaml: config/SLUS_20199/SLUS_201.99.yaml
            url_secret: FILE_URL_USF
          - version: SLUS_201.99_Proto
            artifact_name: SLUS_201.99_Proto
            elf: config/Proto_SLUS_20199_08-24-2001/SLUS_201.99
            splat_yaml: config/Proto_SLUS_20199_08-24-2001/SLUS_201.99.yaml
            url_secret: FILE_URL_USP
            build_target: proto-rebuild
            link_target: proto-mwld-convert
            report_target: proto-report
            report_path: build/proto/report.json

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install toolchain
        run: make install

      - name: Fetch the original ELF
        env:
          FILE_URL: ${{ secrets[matrix.url_secret] }}
        run: |
          if [ -z "$FILE_URL" ]; then
            echo "Secret ${{ matrix.url_secret }} is not set."
            exit 1
          fi
          curl -sSfL -o "${{ matrix.elf }}" "$FILE_URL"
          expected=$(grep -m1 '^sha1:' "${{ matrix.splat_yaml }}" | awk '{print $2}')
          actual=$(sha1sum "${{ matrix.elf }}" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "Downloaded file sha1 $actual, expected $expected."
            exit 1
          fi

      # Splitting/compiling/assembling has to succeed, or there is nothing to
      # report for this matrix entry.
      - name: Build
        run: make ${{ matrix.build_target }}

      # Linking and the byte comparison are allowed to fail so the report
      # below still runs regardless (report generation only depends on
      # objdiff-base/objdiff-target, not on this step). The result is turned
      # back into a job failure at the end. `if:` guards it for any future
      # entry with no link_target (both current entries have one).
      - name: Link and verify
        id: link
        if: matrix.link_target != ''
        continue-on-error: true
        run: make ${{ matrix.link_target }}

      - name: Generate progress report
        run: make ${{ matrix.report_target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.report_path }}
          if-no-files-found: error

      - name: Fail if the rebuilt binary does not match
        if: matrix.link_target != '' && steps.link.outcome != 'success'
        run: |
          echo "::error::The rebuilt binary does not match the original. The progress report was still generated and uploaded."
          exit 1

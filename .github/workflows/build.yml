name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: SLUS_201.99
            elf: config/SLUS_20199/SLUS_201.99
            splat_yaml: config/SLUS_20199/SLUS_201.99.yaml
            url_secret: FILE_URL_USF

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install toolchain
        run: make install

      - name: Fetch the original ELF
        env:
          FILE_URL: ${{ secrets[matrix.url_secret] }}
        run: |
          if [ -z "$FILE_URL" ]; then
            echo "Secret ${{ matrix.url_secret }} is not set."
            exit 1
          fi
          curl -sSfL -o "${{ matrix.elf }}" "$FILE_URL"
          expected=$(grep -m1 '^sha1:' "${{ matrix.splat_yaml }}" | awk '{print $2}')
          actual=$(sha1sum "${{ matrix.elf }}" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "Downloaded file sha1 $actual, expected $expected."
            exit 1
          fi

      # Compiling and assembling has to succeed, or there is nothing to report.
      - name: Build
        run: make rebuild

      # Linking and the byte comparison are allowed to fail so the report below
      # still runs. The result is turned back into a job failure at the end.
      - name: Link and verify
        id: link
        continue-on-error: true
        run: make mwld-convert

      - name: Generate progress report
        run: make report

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/report.json
          if-no-files-found: error

      - name: Fetch the prototype ROM
        env:
          FILE_URL: ${{ secrets.FILE_URL_USP }}
        run: |
          if [ -z "$FILE_URL" ]; then
            echo "Secret FILE_URL_USP is not set."
            exit 1
          fi
          rom=config/Proto_SLUS_20199_08-24-2001/SLUS_201.99
          curl -sSfL -o "$rom" "$FILE_URL"
          expected=$(grep -m1 '^sha1:' config/Proto_SLUS_20199_08-24-2001/SLUS_201.99.yaml | awk '{print $2}')
          actual=$(sha1sum "$rom" | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "Downloaded prototype ROM sha1 $actual, expected $expected."
            exit 1
          fi

      - name: Generate prototype progress report
        run: |
          make splat-proto
          make proto-report

      - uses: actions/upload-artifact@v4
        with:
          name: prototype_report
          path: build/proto/report.json
          if-no-files-found: error

      - name: Fail if the rebuilt binary does not match
        if: steps.link.outcome != 'success'
        run: |
          echo "::error::The rebuilt binary does not match the original. The progress report was still generated and uploaded."
          exit 1
